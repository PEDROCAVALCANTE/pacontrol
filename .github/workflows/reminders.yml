name: 📲 Lembretes WhatsApp Automáticos

on:
  schedule:
    - cron: '0 12 * * *'   # 9h BRT
    - cron: '0 17 * * *'   # 14h BRT (reenvia só o que falhou de manhã)
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que fazer agora'
        type: choice
        default: 'teste (apenas mostra, nao envia)'
        options:
          - 'teste (apenas mostra, nao envia)'
          - 'ENVIAR de verdade aos clientes'

jobs:
  send-reminders:
    name: Enviar lembretes de vencimento
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Instalar dependências
        run: cd scripts && npm install

      - name: Enviar lembretes
        run: node scripts/send-reminders.js
        env:
          # Nos horarios automaticos sempre envia. No disparo manual, so envia
          # quando a opcao escolhida for a de enviar de verdade.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.modo != 'ENVIAR de verdade aos clientes' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
